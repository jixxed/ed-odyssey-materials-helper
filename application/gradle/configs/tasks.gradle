tasks.register("wrapper", Wrapper) {
    gradleVersion = "9.7.0"
}

tasks.register("addLanguageColumn") {
    doLast {
        // Configuration - update these values as needed
        def targetFolder = file('src/main/resources/locale')  // Hardcoded folder path
        def languageTag = 'it'  // Hardcoded language tag (e.g., 'it' for Italian)
        def columnHeader = languageTag  // Header name for the new column

        // Validate folder exists
        if (!targetFolder.exists() || !targetFolder.isDirectory()) {
            throw new GradleException("Target folder does not exist or is not a directory: ${targetFolder.absolutePath}")
        }

        println "Adding language column '${languageTag}' to CSV files in: ${targetFolder.absolutePath}"

        // Find all CSV files recursively
        def csvFiles = []
        targetFolder.eachFileRecurse { file ->
            if (file.isFile() && file.name.toLowerCase().endsWith('.csv')) {
                csvFiles << file
            }
        }

        if (csvFiles.isEmpty()) {
            println "No CSV files found in ${targetFolder.absolutePath}"
            return
        }

        println "Found ${csvFiles.size()} CSV file(s)"

        // Process each CSV file
        csvFiles.each { csvFile ->
            println "Processing: ${csvFile.absolutePath}"

            try {
                def lines = csvFile.readLines('UTF-8')

                if (lines.isEmpty()) {
                    println "  Skipping empty file"
                    return
                }

                // Check if language already exists in header
                def headerLine = lines[0]
                def headerFields = parseCsvLine(headerLine)

                if (headerFields.contains(columnHeader)) {
                    println "  Skipping: Column '${columnHeader}' already exists in header"
                    return
                }

                // Process all lines
                def newLines = []
                lines.eachWithIndex { line, index ->
                    if (line.trim().isEmpty()) {
                        // Preserve empty lines as-is
                        newLines << line
                    } else if (index == 0) {
                        // Header line: append language to header
                        newLines << line + ',"' + columnHeader + '"'
                    } else {
                        // Data line: append empty value
                        newLines << line + ',""'
                    }
                }

                // Write back to file
                csvFile.withWriter('UTF-8') { writer ->
                    newLines.each { writer.writeLine(it) }
                }

                println "  Successfully added '${columnHeader}' column"

            } catch (Exception e) {
                println "  Error processing file: ${e.message}"
                throw new GradleException("Failed to process ${csvFile.absolutePath}", e)
            }
        }

        println "\nCompleted! Processed ${csvFiles.size()} file(s)"
    }
}

// Helper function to parse a CSV line (handles quoted fields)
def parseCsvLine(String line) {
    def fields = []
    def currentField = new StringBuilder()
    def inQuotes = false

    for (int i = 0; i < line.length(); i++) {
        char c = line.charAt(i)

        if (c == '"' as char) {
            if (inQuotes && i + 1 < line.length() && line.charAt(i + 1) == '"' as char) {
                // Escaped quote
                currentField.append('"')
                i++ // Skip next quote
            } else {
                // Toggle quote state
                inQuotes = !inQuotes
            }
        } else if (c == ',' as char && !inQuotes) {
            // Field separator
            fields << currentField.toString()
            currentField = new StringBuilder()
        } else {
            currentField.append(c)
        }
    }

    // Add last field
    fields << currentField.toString()

    return fields
}
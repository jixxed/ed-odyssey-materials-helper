// Code generation: SCSS → CSS

tasks.register('compileSassDefault', compileSass.getClass()) {
    group = "edomh > sass"
    outputs.upToDateWhen { false }
    sourceDir = file('src/main/resources/sass/default')
    sassPath = ''
    destinationDir = file("src/main/resources/css/compiled")
    indent = "  "
    linefeed = "\n";
    omitSourceMapUrl = false
    outputStyle = "NESTED";
    precision = 8
    sourceComments = false
    sourceMapContents = false
    sourceMapEmbed = false
    sourceMapEnabled = false
}

tasks.register('compileSassColorblind', compileSass.getClass()) {
    group = "edomh > sass"
    outputs.upToDateWhen { false }
    description = 'Compiles Sass files to CSS'
    sourceDir = file('src/main/resources/sass/colorblind')
    sassPath = ''
    destinationDir = file('src/main/resources/css/compiled')
    indent = '  '
    linefeed = '\n'
    omitSourceMapUrl = false
    outputStyle = 'NESTED'
    precision = 8
    sourceComments = false
    sourceMapContents = false
    sourceMapEmbed = false
    sourceMapEnabled = false
}

// Wire Sass compilation into the build lifecycle
compileJava.dependsOn tasks.named('compileSassDefault')
compileJava.dependsOn tasks.named('compileSassColorblind')

tasks.named('compileSass') {
    group = "edomh > sass"
    dependsOn tasks.named('compileSassDefault')
    dependsOn tasks.named('compileSassColorblind')
}
